<script>
/* ====== Constantes / estado ====== */
const OPT_PRUEBA_VALUE = 'PRUEBA_SPECIAL';
const alumnos = [];
let tiposClase = [];
let pagosGlobal = [];

/* ====== Util ====== */
function normalizarTexto(texto) {
  return (texto || '').toLowerCase().trim().replace(/\s+/g, ' ');
}

// 👇 Pegá aquí los helpers
function normalizarSede(valor) {
  const txt = (valor || '').toLowerCase();
  if (txt.includes('goyena')) return 'Goyena';
  if (txt.includes('craig'))  return 'Craig';
  return 'General';
}

// Clave mes: para pagos normales usa mes_pagado (YYYY-MM),
// para prueba toma YYYY-MM desde fecha_pago
function getMesKey(p) {
  if (p.alumno_id === OPT_PRUEBA_VALUE) {
    const d = new Date(p.fecha_pago);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    return `${y}-${m}`;
  }
  return p.mes_pagado || 'Sin Mes';
}

// ======== Selector de meses ========
let anioSeleccionado = new Date().getFullYear();
let mesSeleccionado = null;
let pagosAlumno = [];

function initMeses() {
    document.getElementById("anioActual").textContent = anioSeleccionado;
    const cont = document.getElementById("mesesGrid");
    cont.innerHTML = "";

    const nombres = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

    for (let i = 0; i < 12; i++) {
        const nombre = nombres[i];
        const mesClave = `${anioSeleccionado}-${String(i+1).padStart(2,'0')}`;
        const pagado = pagosAlumno.includes(mesClave);

        const div = document.createElement("div");
        div.className = "mesBtn" + (pagado ? " pago" : "");
        if (mesSeleccionado === mesClave) div.classList.add("seleccionado");
        div.textContent = nombre;
        div.onclick = () => seleccionarMes(mesClave);

        cont.appendChild(div);
    }
}

function seleccionarMes(mes) {
    mesSeleccionado = mes;
    initMeses();
}

function cambiarAnio(dir) {
    anioSeleccionado += dir;
    initMeses();
}


/* ====== UI: monto parcial ====== */
document.getElementById("parcial").addEventListener("change", (e) => {
  const grupo = document.getElementById("grupoMontoManual");
  const montoParcial = document.getElementById("montoParcial");
  grupo.style.display = e.target.checked ? 'block' : 'none';
  montoParcial.disabled = !e.target.checked;
});

/* ====== Select2 ====== */
$(document).ready(() => {
  $('#alumno-select').select2({
    placeholder: "Seleccionar alumno",
    width: '100%'
  });
});

/* ====== Cargar cuentas ====== */
async function cargarCuentas() {
  try {
    const res = await fetch('/cuentas');
    const cuentas = await res.json();
    const select = document.getElementById('cuenta');
    select.innerHTML = '<option value="">Seleccionar cuenta</option>';
    cuentas.forEach(c => {
      const option = document.createElement('option');
      option.value = c.nombre;
      option.textContent = c.nombre;
      select.appendChild(option);
    });
  } catch (err) {
    console.error('Error al cargar cuentas:', err);
  }
}

/* ====== ONLOAD ====== */
window.onload = async () => {
  // Seguridad (ya la tenés arriba, pero lo dejamos por si este script se mueve)
  if (localStorage.getItem('etnya_login') !== 'ok') {
    window.location.href = 'login.html';
    return;
  }

  // 1) Datos base
  const resAlumnos = await fetch('/alumnos');
  const dataAlumnos = await resAlumnos.json();
  alumnos.splice(0, alumnos.length, ...dataAlumnos);

  await cargarCuentas();

  const resTipos = await fetch('/tipos-clase');
  tiposClase = await resTipos.json();

  // 2) Poblar selector de alumnos (+ opción PRUEBA al inicio)
  const alumnoSelect = document.getElementById("alumno-select");
  alumnoSelect.innerHTML = '';

  // Opción especial primero
  const optPrueba = new Option('000 - General - Pagos de clases de prueba', OPT_PRUEBA_VALUE, false, false);
  alumnoSelect.add(optPrueba);

  // Luego alumnos reales
  alumnos.forEach(a => {
    const option = document.createElement("option");
    option.value = a.id;
    let numeroFormateado = a.numero_alumno;
    if (a.numero_alumno < 100) {
      numeroFormateado = String(a.numero_alumno).padStart(2, '0');
    }
    option.textContent = `${numeroFormateado}-${a.sede || ''} - ${a.apellido}, ${a.nombre}`;
    alumnoSelect.appendChild(option);
  });

  // 3) Cambio de alumno => conmuta UI (normal vs prueba)
 $('#alumno-select').on('change', function () {
    const id = this.value;
    const esPrueba = (id === OPT_PRUEBA_VALUE);

    // Bloques a ocultar/mostrar
    const $modalidad   = document.getElementById('modalidad')?.parentElement;
    const $montoStd    = document.getElementById('monto')?.parentElement;
    const $grupoManual = document.getElementById('grupoMontoManual');
    const $chkParcial  = document.getElementById('parcial');
    const $grupoPrueba = document.getElementById('grupoPrueba');

    if ($grupoPrueba) $grupoPrueba.style.display = esPrueba ? 'block' : 'none';
    if ($modalidad)   $modalidad.style.display   = esPrueba ? 'none' : 'block';
    if ($montoStd)    $montoStd.style.display    = esPrueba ? 'none' : 'block';

    if ($grupoManual)
        $grupoManual.style.display = esPrueba ? 'none' : ($chkParcial.checked ? 'block' : 'none');

    if ($chkParcial) {
        $chkParcial.disabled = esPrueba;
        if (esPrueba) {
            $chkParcial.checked = false;
            document.getElementById('montoParcial').value = '';
        }
    }

    // 🔥 Si es PRUEBA, limpiamos meses y salimos
    if (esPrueba) {
        pagosAlumno = [];
        mesSeleccionado = null;
        initMeses();
        return;
    }

    // Alumno normal
    const alumno = alumnos.find(a => String(a.id) === String(id));
    if (!alumno) return;

    const tipo = tiposClase.find(t =>
        normalizarTexto(t.modalidad) === normalizarTexto(alumno.tipo_clase)
    );

    document.getElementById("modalidad").value = alumno.tipo_clase || '';
    document.getElementById("monto").value     = tipo?.precio || '';

    // ============================================================
    // 🔥🔥🔥 CARGAR MESES PAGADOS DEL ALUMNO — ACÁ ESTABA EL ERROR
    // ============================================================

    fetch('/pagos')
        .then(r => r.json())
        .then(lista => {
            const alumnoIdSeleccionado = String(id);

            pagosAlumno = lista
                .filter(p => String(p.alumno_id) === alumnoIdSeleccionado)
                .map(p => {
                    const raw = String(p.mes_pagado || '').trim();
                    return raw.slice(0, 7); // → YYYY-MM
                })
                .filter(Boolean);

            console.log("Meses pagados detectados:", pagosAlumno);

            mesSeleccionado = null;
            initMeses();
        })
        .catch(err => {
            console.error("Error cargando meses pagados:", err);
            pagosAlumno = [];
            mesSeleccionado = null;
            initMeses();
        });
});

// 4) Buscador
  document.getElementById('buscadorPagos').addEventListener('input', (e) => {
    renderSocios(e.target.value);
  });

  // 4.1) Si venimos desde la tabla de alumnos con ?alumno=ID, preseleccionarlo y abrir el formulario
  const paramsURL = new URLSearchParams(window.location.search);
  const alumnoIdURL = paramsURL.get('alumno');
  if (alumnoIdURL && alumnos.some(a => String(a.id) === String(alumnoIdURL))) {
    alumnoSelect.value = alumnoIdURL;
    document.getElementById('formularioPago').style.display = 'block';
  }

  // 5) Disparar cambio y cargar pagos
  alumnoSelect.dispatchEvent(new Event('change'));
  $('#alumno-select').trigger('change.select2');
  await cargarPagos();

  if (alumnoIdURL) {
    document.getElementById('formularioPago')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
};

/* ====== Guardar pago ====== */
async function guardarPago() {
  const alumnoId = $('#alumno-select').val();
  const cuenta   = document.getElementById("cuenta").value;

  if (!cuenta) {
    alert("Seleccioná la cuenta.");
    return;
  }

  // Flujo especial PRUEBA
  if (alumnoId === OPT_PRUEBA_VALUE) {
    const montoFijo  = document.getElementById('montoFijo')?.value;
    const comentario = document.getElementById('comentarioPrueba')?.value || null;
    const sede       = document.getElementById('sedePrueba')?.value;

    if (!montoFijo || isNaN(montoFijo) || parseFloat(montoFijo) <= 0) {
      alert("Ingresá un monto válido para el pago de prueba.");
      return;
    }

if (!sede) {
  alert("Seleccioná la sede para el pago de prueba.");
  return;
}



    try {
      const res = await fetch('/pagos/prueba', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({
    comentario,
    monto: parseFloat(montoFijo),
    cuenta,
    sede
  })
});
      if (res.ok) {
        alert("Pago de prueba registrado con éxito.");
        await cargarPagos();
        cerrarFormularioPago();
      } else {
        alert("Error al registrar el pago de prueba.");
      }
    } catch (e) {
      console.error(e);
      alert("Ocurrió un error al registrar el pago de prueba.");
    }
    return;
  }

  // Flujo alumno normal
  const mes = mesSeleccionado;
if (!mes) {
    alert("Seleccioná el mes a pagar.");
    return;
}
  let monto = '';
  if (document.getElementById("parcial").checked) {
    monto = document.getElementById("montoParcial").value;
    if (!monto || isNaN(monto) || parseFloat(monto) <= 0) {
      alert("Ingresá un monto parcial válido.");
      return;
    }
  } else {
    monto = document.getElementById("monto").value;
  }

  if (!alumnoId || !mes || !monto) {
    alert("Faltan datos obligatorios.");
    return;
  }

  try {
    const res = await fetch('/pagos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        alumno_id: alumnoId,
        mes_pagado: mes,
        monto: parseFloat(monto),
        cuenta
      })
    });

    if (res.ok) {
      alert("Pago registrado con éxito.");
      await cargarPagos();
      cerrarFormularioPago();
    } else if (res.status === 409) {
      alert("Ya existe un pago registrado para ese alumno en ese mes.");
    } else {
      alert("Error al registrar el pago.");
    }
  } catch (error) {
    console.error("Error en la solicitud:", error);
    alert("Ocurrió un error al intentar registrar el pago.");
  }
}

/* ====== Listado / Render ====== */
async function cargarPagos() {
  const [resPagos, resPrueba] = await Promise.all([
    fetch('/pagos'),
    fetch('/pagos/prueba')
  ]);

  const pagos = await resPagos.json();
  const pagosPrueba = await resPrueba.json();

  const mappedPrueba = (pagosPrueba || []).map(p => ({
    id        : p.id,
    alumno_id : OPT_PRUEBA_VALUE,
    mes_pagado: '-',        // no usa esta columna para agrupar
    monto     : p.monto,
    cuenta    : p.cuenta,
    fecha_pago: p.fecha_pago,
    __tipo    : 'prueba',
    __comentario: p.comentario || '',
    __sede    : p.sede || 'General'
  }));

  // 👇 corregido
  pagosGlobal = [...pagos, ...mappedPrueba];

const q = document.getElementById('buscadorPagos')?.value || '';
  renderSocios(q);
}

function renderSocios(query = '') {
  const tbody = document.getElementById('tbodySocios');
  tbody.innerHTML = '';

  const term = normalizarTexto(query);

  // Fila especial de pagos de clases de prueba, siempre primero
  const labelPrueba = normalizarTexto('000 pagos de clases de prueba');
  if (!term || labelPrueba.includes(term)) {
    const trPrueba = document.createElement('tr');
    trPrueba.innerHTML = `
      <td>000</td>
      <td colspan="2">Pagos de clases de prueba</td>
      <td>General</td>
      <td><button class="btn-ver-detalle" onclick="abrirDetallePagos('${OPT_PRUEBA_VALUE}')">Ver detalle</button></td>
    `;
    tbody.appendChild(trPrueba);
  }

  const listaFiltrada = (alumnos || [])
    .filter(a => {
      if (!term) return true;
      const nro = String(a.numero_alumno || '');
      const ape = normalizarTexto(a.apellido || '');
      const nom = normalizarTexto(a.nombre || '');
      return nro.includes(term) || ape.includes(term) || nom.includes(term) ||
             normalizarTexto(`${ape} ${nom}`).includes(term);
    })
    .sort((a, b) => (a.numero_alumno || 0) - (b.numero_alumno || 0));

  listaFiltrada.forEach(a => {
    const numero = (a.numero_alumno < 100)
      ? String(a.numero_alumno).padStart(2, '0')
      : a.numero_alumno;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${numero}</td>
      <td>${a.apellido || ''}</td>
      <td>${a.nombre || ''}</td>
      <td>${a.sede || ''}</td>
      <td><button class="btn-ver-detalle" onclick="abrirDetallePagos(${a.id})">Ver detalle</button></td>
    `;
    tbody.appendChild(tr);
  });
}

/* ====== Modal de detalle de pagos de un socio ====== */
function abrirDetallePagos(alumnoId) {
  const esPrueba = (String(alumnoId) === OPT_PRUEBA_VALUE);
  const modal   = document.getElementById('modalDetallePagos');
  const titulo  = document.getElementById('detalleTitulo');
  const lista   = document.getElementById('detalleLista');

  let pagosDelSocio;

  if (esPrueba) {
    titulo.textContent = 'Pagos de clases de prueba';
    pagosDelSocio = (pagosGlobal || []).filter(p => p.alumno_id === OPT_PRUEBA_VALUE);
  } else {
    const alumno = alumnos.find(a => String(a.id) === String(alumnoId));
    titulo.textContent = alumno ? `${alumno.apellido}, ${alumno.nombre}` : 'Pagos del socio';
    pagosDelSocio = (pagosGlobal || []).filter(p => String(p.alumno_id) === String(alumnoId));
  }

  pagosDelSocio = pagosDelSocio.slice().sort((a, b) => new Date(b.fecha_pago) - new Date(a.fecha_pago));

  if (!pagosDelSocio.length) {
    lista.innerHTML = '<p style="text-align:center;color:#999;">Todavía no tiene pagos registrados.</p>';
  } else if (esPrueba) {
    lista.innerHTML = pagosDelSocio.map(p => `
      <div class="detalle-item">
        <div>
          <div class="detalle-mes">Prueba${p.__comentario ? ` — ${p.__comentario}` : ''}</div>
          <div class="detalle-sub">${p.__sede || 'General'} · ${p.cuenta || '-'} · ${new Date(p.fecha_pago).toLocaleDateString('es-AR')}</div>
        </div>
        <div class="detalle-monto">$${parseFloat(p.monto).toFixed(2)}</div>
        <button class="detalle-borrar" title="Eliminar" onclick="eliminarPagoPruebaDesdeDetalle(${p.id})">🗑️</button>
      </div>
    `).join('');
  } else {
    lista.innerHTML = pagosDelSocio.map(p => {
      const [y, m] = String(p.mes_pagado || '').split('-');
      const mesFmt = (y && m) ? `${m}/${y}` : '-';
      return `
        <div class="detalle-item">
          <div>
            <div class="detalle-mes">Mes ${mesFmt}</div>
            <div class="detalle-sub">${p.cuenta || '-'} · ${new Date(p.fecha_pago).toLocaleDateString('es-AR')}</div>
          </div>
          <div class="detalle-monto">$${parseFloat(p.monto).toFixed(2)}</div>
          <button class="detalle-borrar" title="Eliminar" onclick="eliminarPagoDesdeDetalle(${p.id}, ${alumnoId})">🗑️</button>
        </div>
      `;
    }).join('');
  }

  modal.style.display = 'flex';
}

function cerrarDetallePagos() {
  document.getElementById('modalDetallePagos').style.display = 'none';
}

async function eliminarPago(id) {
  if (!confirm("¿Estás seguro de que querés eliminar este pago?")) return;
  const res = await fetch(`/pagos/${id}`, { method: 'DELETE' });
  if (res.ok) {
    alert("Pago eliminado correctamente.");
    await cargarPagos();
  } else {
    alert("Error al eliminar el pago.");
  }
}
